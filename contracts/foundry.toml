[profile.default]
src = "src"
out = "out"
libs = ["lib"]

# T011 discovery: with defaults (optimizer off) KiteCore is 28,367 bytes —
# above the EIP-170 24,576 deploy limit; forge TESTS never enforce it, the
# live chain does. via-ir + optimizer is the fix (legacy codegen + optimizer
# trips stack-too-deep; solc's own recommendation is viaIR).
via_ir = true
optimizer = true
optimizer_runs = 200

[invariant]
# T022: bounded so the 12-test suite stays in CI time; every §6.4 item is
# still hit thousands of times (32 runs x 64 depth x 13 actions x 12 tests).
runs = 32
depth = 64
fail_on_revert = false

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
