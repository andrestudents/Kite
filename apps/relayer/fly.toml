# @kite/relayer on Fly.io — run `fly launch --no-deploy` from the REPO ROOT
# (it finds this file via apps/relayer), then `fly secrets set ...` (see
# apps/relayer/DEPLOY.md), then `fly deploy`.
# RELAYER_KEY is the funded RELAYER_ROLE holder — a Fly SECRET, never a build
# arg, never in git. Same region as the API (sin) so the API→relayer hop is LAN.
app = "kite-relayer"
primary_region = "sin"

[build]
  dockerfile = "apps/relayer/Dockerfile"

[http_service]
  internal_port = 3001
  force_https = true

  # Keep one machine warm — the worker polls; a cold start mid-demo is the
  # wrong surprise. (Still within Fly's free allowance for one small machine.)
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # Array-of-tables ([[...]]) — Fly's schema wants http_service.checks as a
  # list; the single-table [http_service.checks] form fails to unmarshal.
  [[http_service.checks]]
    port = 3001
    type = "http"
    interval = "10s"
    timeout = "3s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
