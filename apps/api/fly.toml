# @kite/api on Fly.io — run `fly launch` from the REPO ROOT (it finds this
# file via apps/api), then `fly secrets set ...` (see apps/api/DEPLOY.md),
# then `fly deploy`. Region sin = Singapore, closest to WIB judges.
app = "kite-api"
primary_region = "sin"

[build]
  dockerfile = "apps/api/Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true

  # Keep one machine warm — a cold start mid-demo is the wrong surprise.
  # (Still within Fly's free allowance for a single small machine.)
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # Array-of-tables ([[...]]) — Fly's schema wants http_service.checks as a
  # list; the single-table [http_service.checks] form fails to unmarshal.
  [[http_service.checks]]
    port = 3000
    type = "http"
    interval = "10s"
    timeout = "3s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
